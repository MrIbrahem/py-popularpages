[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "popularpages"
version = "0.1.0"
description = "A tool for generating monthly popular pages reports for WikiProjects."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mwclient>=0.10.1",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "PyMySQL>=1.1",
    "tenacity>=8.2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://wikitech.wikimedia.org/wiki/Tool:Popular_Pages"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
popularpages-check = "popularpages.cli.check_reports:main"
popularpages-report = "popularpages.cli.generate_report:main"
popularpages-index = "popularpages.cli.generate_index:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
