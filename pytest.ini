[pytest]
testpaths = tests
pythonpath = ./ ./src
python_files = test*.py *Test.py Test*.py
python_classes = Test*
python_functions = test*
addopts =
    -v
    -m "not network"
    --tb=short
    --strict-markers
    --durations=10
    --maxfail=25
    ; --cov src
    --cov-report=term-missing
	--cov-report=html
markers =
    all: runs all tests
    unit: marks tests as unit tests
    asyncio: marks tests that require asyncio
    network: marks tests that require network access
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    ignore:unclosed database <sqlite3.Connection:ResourceWarning
    ignore:Enable tracemalloc to get the object allocation traceback
    ignore:unclosed database in <sqlite3.Connection object at
